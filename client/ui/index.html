<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TOPAZ Retail Contact-Center Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --panel: #161b22;
    --panel-hover: #1f242c;
    --accent: #58a6ff;
    --accent-bg: rgba(56, 139, 253, 0.15);
    --bad: #f85149;
    --bad-bg: rgba(248, 81, 73, 0.15);
    --ok: #3fb950;
    --ok-bg: rgba(63, 185, 80, 0.15);
    --warning: #d29922;
    --warning-bg: rgba(210, 153, 34, 0.15);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --fg: #1f2328;
      --muted: #656d76;
      --line: #d0d7de;
      --panel: #ffffff;
      --panel-hover: #f3f4f6;
      --accent: #0969da;
      --accent-bg: rgba(9, 105, 218, 0.1);
      --bad: #cf222e;
      --bad-bg: rgba(207, 34, 46, 0.1);
      --ok: #1a7f37;
      --ok-bg: rgba(26, 127, 55, 0.1);
      --warning: #9a6700;
      --warning-bg: rgba(154, 103, 0, 0.1);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 120px; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }
  h1 { font-size: 18px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .badge-mcp {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 12px;
    border: 1px solid var(--accent);
  }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .clear-btn:hover { color: var(--fg); border-color: var(--fg); }
  .banner {
    border: 1px solid var(--line);
    border-left: 4px solid var(--warning);
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .banner.degraded { border-left-color: var(--bad); }
  .turn {
    margin-bottom: 28px;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .q-box {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 12px;
  }
  .q-icon {
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  .q { font-weight: 600; font-size: 15px; }
  .a-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
  }
  .a { white-space: pre-wrap; line-height: 1.6; }
  .stamp {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--panel-hover);
    border: 1px solid var(--line);
  }
  .sources { margin-top: 14px; }
  .sources h3 {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .src {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--panel-hover);
    font-size: 13px;
  }
  .src .t { font-weight: 600; color: var(--accent); }
  .src .s { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .src .x { margin-top: 6px; color: var(--fg); font-size: 12.5px; line-height: 1.5; }
  
  .confirmation-gate {
    margin-top: 14px;
    background: var(--warning-bg);
    border: 1px solid var(--warning);
    border-radius: 6px;
    padding: 12px 16px;
  }
  .confirmation-title { font-weight: 600; color: var(--warning); margin-bottom: 6px; font-size: 13.5px; }
  .confirmation-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-confirm {
    background: var(--ok);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    font-weight: 500;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-cancel {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--fg);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-confirm:hover { opacity: 0.9; }
  .btn-cancel:hover { background: var(--panel-hover); }

  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: 12.5px; user-select: none; }
  pre {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 11.5px;
    margin: 8px 0 0;
    line-height: 1.45;
  }
  form {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    padding: 16px 20px;
    box-shadow: 0 -4px 16px rgba(0,0,0,0.15);
  }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  input[type=text] {
    flex: 1;
    padding: 12px 16px;
    font: inherit;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button.submit-btn {
    padding: 12px 24px;
    font: inherit;
    font-weight: 500;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button.submit-btn:disabled { opacity: .5; cursor: default; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warning); }
  .examples { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .examples button {
    background: none;
    color: var(--accent);
    border: 0;
    padding: 0 8px 0 0;
    font: inherit;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>TOPAZ Retail Contact-Center <span class="badge-mcp">MCP Enterprise</span></h1>
      <div class="meta" id="meta">loading configuration…</div>
    </div>
    <button type="button" class="clear-btn" id="clearBtn">Clear Chat</button>
  </header>

  <div id="banner"></div>

  <p class="examples">
    Try:
    <button type="button" data-q="Can a customer return opened electronics at Best Buy?">opened electronics</button>
    <button type="button" data-q="Look up order ORD-9011">order lookup</button>
    <button type="button" data-q="Can they return order ORD-9031 — what's the window and is it eligible?">composite Q15</button>
    <button type="button" data-q="open a return for order ORD-9011, item ITEM-9011-1, reason damaged">action Q22</button>
  </p>

  <div id="log"></div>
</div>

<form id="form">
  <div class="row">
    <input type="text" id="q" placeholder="Ask about retail policies, orders, or create a return…" autocomplete="off" autofocus>
    <button class="submit-btn" id="send">Send</button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const banner = document.getElementById("banner");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");
const clearBtn = document.getElementById("clearBtn");

let conversationHistory = [];

fetch("/api/config").then(r => r.json()).then(c => {
  document.getElementById("meta").textContent =
    `Model: ${c.model} · System Prompt: ${c.prompt_version} · Max ${c.max_rounds} tool rounds`;
});

clearBtn.onclick = () => {
  conversationHistory = [];
  log.replaceChildren();
  banner.replaceChildren();
  input.focus();
};

document.querySelectorAll(".examples button").forEach(b => {
  b.onclick = () => { input.value = b.dataset.q; form.requestSubmit(); };
});

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderSources(turn, data) {
  const passages = [];
  for (const ev of data.trace || []) {
    const p = ev.payload;
    if (p && Array.isArray(p.results)) {
      for (const r of p.results) passages.push({ server: ev.server, r });
    }
  }
  if (!passages.length) return;

  const box = el("div", "sources");
  box.appendChild(el("h3", null, `Retrieved Sources (${passages.length})`));
  for (const { server, r } of passages) {
    const card = el("div", "src");
    const title = r.source || r.chunk_id || "(operational record)";
    card.appendChild(el("div", "t", r.section ? `${title} — ${r.section}` : title));
    const score = typeof r.score === "number" ? r.score.toFixed(4) : "n/a";
    card.appendChild(el("div", "s", `Server: ${server} · ID: ${r.chunk_id || "record"} · Score: ${score}`));
    const text = (r.content || "").trim();
    card.appendChild(el("div", "x", text.length > 320 ? text.slice(0, 320) + "…" : text));
    box.appendChild(card);
  }
  turn.appendChild(box);
}

function renderTurn(question, data) {
  const turn = el("div", "turn");
  
  const qBox = el("div", "q-box");
  qBox.appendChild(el("div", "q-icon", "User"));
  qBox.appendChild(el("div", "q", question));
  turn.appendChild(qBox);

  const aBox = el("div", "a-box");
  aBox.appendChild(el("div", "a", data.answer));

  const calls = (data.trace || []).length;
  const failed = (data.trace || []).filter(e => !e.ok).length;
  const stamp = el("div", "stamp");
  stamp.appendChild(el("span", "chip", `${data.rounds} round(s)`));
  stamp.appendChild(el("span", "chip", `${calls} tool call(s)`));
  stamp.appendChild(el("span", "chip", `${(data.tools_offered || []).length} tools discovered`));
  
  if (failed) {
    const failSpan = el("span", "chip bad", `${failed} call failed`);
    stamp.appendChild(failSpan);
  }
  aBox.appendChild(stamp);

  renderSources(aBox, data);

  if (calls) {
    const det = el("details");
    det.appendChild(el("summary", null, `🔍 Inspect Tool Trace (${calls} calls)`));
    for (const ev of data.trace) {
      const head = el("div", "s");
      head.style.marginTop = "6px";
      head.textContent = `Round ${ev.round} · ${ev.server}.${ev.tool} `;
      head.appendChild(el("span", ev.ok ? "ok" : "bad", ev.ok ? "[SUCCESS]" : `[FAILED: ${ev.note}]`));
      det.appendChild(head);
      det.appendChild(el("pre", null,
        JSON.stringify({ arguments: ev.arguments, payload: ev.payload }, null, 2)));
    }
    aBox.appendChild(det);
  }

  // Interactive Confirmation Gate
  if (data.pending_write) {
    const gate = el("div", "confirmation-gate");
    gate.appendChild(el("div", "confirmation-title", "⚠️ Action Confirmation Required (Human Safety Gate)"));
    gate.appendChild(el("div", null, `Proposed Tool: ${data.pending_write.tool} with parameters ${JSON.stringify(data.pending_write.arguments)}`));
    
    const actions = el("div", "confirmation-actions");
    const confirmBtn = el("button", "btn-confirm", "Confirm & Proceed");
    confirmBtn.onclick = () => {
      input.value = "Yes, please confirm and proceed.";
      form.requestSubmit();
    };
    const cancelBtn = el("button", "btn-cancel", "Cancel");
    cancelBtn.onclick = () => {
      input.value = "No, cancel this action.";
      form.requestSubmit();
    };
    actions.appendChild(confirmBtn);
    actions.appendChild(cancelBtn);
    gate.appendChild(actions);
    aBox.appendChild(gate);
  }

  turn.appendChild(aBox);
  log.appendChild(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  input.value = "";
  send.disabled = true;
  
  const pending = el("div", "turn");
  const qBox = el("div", "q-box");
  qBox.appendChild(el("div", "q-icon", "User"));
  qBox.appendChild(el("div", "q", question));
  pending.appendChild(qBox);
  
  const aBox = el("div", "a-box");
  aBox.appendChild(el("div", "a stamp", "Agent is thinking and querying MCP tools…"));
  pending.appendChild(aBox);
  log.appendChild(pending);
  pending.scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history: conversationHistory }),
    });
    const data = await res.json();
    pending.remove();

    if (!res.ok) {
      const t = el("div", "turn");
      const errBox = el("div", "a-box");
      errBox.appendChild(el("div", "a bad", data.error || "Request failed"));
      t.appendChild(errBox);
      log.appendChild(t);
    } else {
      renderTurn(question, data);

      // Accumulate multi-turn context
      conversationHistory.push({ role: "user", content: question });
      conversationHistory.push({ role: "assistant", content: data.answer });
      if (conversationHistory.length > 10) {
        conversationHistory = conversationHistory.slice(-10);
      }

      const down = Object.entries(data.unreachable || {});
      banner.replaceChildren();
      if (down.length) {
        const b = el("div", "banner degraded");
        b.textContent = "Degraded mode — running without: " +
          down.map(([n, why]) => `${n} (${why})`).join("; ");
        banner.appendChild(b);
      }
      // An answer the client already knows is one-sided, or one it refused to
      // ground, has to say so where the answer is read. Both states were
      // recorded server-side only, which told the person relying on the answer
      // nothing at all.
      if ((data.composite_incomplete || []).length) {
        const half = data.composite_incomplete.indexOf("search") !== -1
          ? "policy documents" : "operational records";
        const b = el("div", "banner degraded");
        b.textContent =
          "Incomplete answer — this question needed both a policy rule and a " +
          "record, but the " + half + " were never retrieved. Treat this as " +
          "one-sided and verify before acting on it.";
        banner.appendChild(b);
      }
      if (data.grounding_blocked) {
        const b = el("div", "banner degraded");
        b.textContent =
          "Answer withheld — the assistant produced text with no retrieved " +
          "source behind it, so it was discarded rather than shown.";
        banner.appendChild(b);
      }
    }
  } catch (err) {
    pending.remove();
    const t = el("div", "turn");
    const errBox = el("div", "a-box");
    errBox.appendChild(el("div", "a bad", "Client error: " + err));
    t.appendChild(errBox);
    log.appendChild(t);
  } finally {
    send.disabled = false;
    input.focus();
  }
};
</script>
</body>
</html>
