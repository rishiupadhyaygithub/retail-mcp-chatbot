<!DOCTYPE html>
<meta charset="utf-8">
<title>Retail contact-center assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Design document §6: one plain page, no framework, no build step. It replaces
  the console — one live conversation, no persistence, sources under each
  answer. The tool pane is the part that matters during evaluation: a wrong
  answer could come from retrieval, routing, or the model ignoring good
  passages, and those are scored separately, so the raw tool calls are always
  one click away.
-->
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5c6470; --line: #dfe3e8;
    --panel: #f6f7f9; --accent: #1d4ed8; --bad: #b42318; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e8eaed; --muted: #9aa3af; --line: #2b2f36;
      --panel: #1b1e24; --accent: #7aa2f7; --bad: #f87171; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 20px 96px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 20px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; }
  .banner {
    border: 1px solid var(--line); border-left: 3px solid var(--bad);
    background: var(--panel); padding: 8px 12px; border-radius: 4px;
    font-size: 13px; margin-bottom: 16px;
  }
  .turn { margin-bottom: 28px; }
  .q { font-weight: 600; margin-bottom: 10px; }
  .q::before { content: "› "; color: var(--muted); }
  .a { white-space: pre-wrap; }
  .stamp { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .sources { margin-top: 12px; }
  .sources h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 6px;
  }
  .src {
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
    margin-bottom: 6px; background: var(--panel); font-size: 13px;
  }
  .src .t { font-weight: 600; }
  .src .s { color: var(--muted); font-size: 12px; }
  .src .x { margin-top: 4px; color: var(--muted); }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0;
  }
  form {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 12px 20px;
  }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
  }
  button {
    padding: 10px 18px; font: inherit; border: 0; border-radius: 4px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button[disabled] { opacity: .5; cursor: default; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .examples { font-size: 13px; color: var(--muted); }
  .examples button {
    background: none; color: var(--accent); border: 0; padding: 0 6px 0 0;
    font: inherit; cursor: pointer; text-decoration: underline;
  }
</style>

<div class="wrap">
  <header>
    <h1>Retail contact-center assistant</h1>
    <div class="meta" id="meta">loading…</div>
  </header>

  <div id="banner"></div>

  <p class="examples">
    Try:
    <button type="button" data-q="Can a customer return opened electronics?">opened electronics</button>
    <button type="button" data-q="How long does a refund take to appear?">refund timing</button>
    <button type="button" data-q="What is the CEO's home address?">an unanswerable one</button>
  </p>

  <div id="log"></div>
</div>

<form id="form">
  <div class="row">
    <input type="text" id="q" placeholder="Ask about retail policy…" autocomplete="off" autofocus>
    <button id="send">Ask</button>
  </div>
</form>

<script>
const log = document.getElementById("log");
const banner = document.getElementById("banner");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

fetch("/api/config").then(r => r.json()).then(c => {
  document.getElementById("meta").textContent =
    `model ${c.model} · system prompt ${c.prompt_version} · max ${c.max_rounds} tool rounds`;
});

document.querySelectorAll(".examples button").forEach(b => {
  b.onclick = () => { input.value = b.dataset.q; form.requestSubmit(); };
});

// The server's payload is data, not markup: everything below goes in through
// textContent so a retrieved document can never inject script into this page.
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderSources(turn, data) {
  const passages = [];
  for (const ev of data.trace) {
    const p = ev.payload;
    if (p && Array.isArray(p.results)) {
      for (const r of p.results) passages.push({ server: ev.server, r });
    }
  }
  if (!passages.length) return;

  const box = el("div", "sources");
  box.appendChild(el("h3", null, `Sources (${passages.length})`));
  // Field names are contract v1 §4: content / source / section / score /
  // chunk_id. They are read defensively because a teammate's server is only as
  // conformant as their last commit, and a missing field must degrade to a
  // readable card rather than render "undefined".
  for (const { server, r } of passages) {
    const card = el("div", "src");
    const title = r.source || r.chunk_id || "(untitled)";
    card.appendChild(el("div", "t", r.section ? `${title} — ${r.section}` : title));
    const score = typeof r.score === "number" ? r.score.toFixed(4) : "n/a";
    card.appendChild(el("div", "s", `${server} · ${r.chunk_id || ""} · score ${score}`));
    const text = (r.content || "").trim();
    card.appendChild(el("div", "x", text.length > 320 ? text.slice(0, 320) + "…" : text));
    box.appendChild(card);
  }
  turn.appendChild(box);
}

function renderTurn(question, data) {
  const turn = el("div", "turn");
  turn.appendChild(el("div", "q", question));
  turn.appendChild(el("div", "a", data.answer));

  const calls = data.trace.length;
  const failed = data.trace.filter(e => !e.ok).length;
  const stamp = el("div", "stamp");
  stamp.textContent =
    `${data.rounds} round(s) · ${calls} tool call(s) · ` +
    `${data.tools_offered.length} tool(s) discovered at runtime`;
  if (failed) {
    stamp.appendChild(el("span", "bad", ` · ${failed} failed`));
  }
  turn.appendChild(stamp);

  renderSources(turn, data);

  if (calls) {
    const det = el("details");
    det.appendChild(el("summary", null, `Tool calls (${calls}) — raw payloads`));
    for (const ev of data.trace) {
      const head = el("div", "s");
      head.textContent = `round ${ev.round} · ${ev.server}.${ev.tool}`;
      head.appendChild(el("span", ev.ok ? "ok" : "bad", ev.ok ? "  ok" : `  failed: ${ev.note}`));
      det.appendChild(head);
      det.appendChild(el("pre", null,
        JSON.stringify({ arguments: ev.arguments, payload: ev.payload }, null, 2)));
    }
    turn.appendChild(det);
  }

  if (data.pending_write) {
    const warn = el("div", "banner");
    warn.textContent = "Write tool requested — not executed. Confirmation required.";
    turn.appendChild(warn);
  }

  log.appendChild(turn);
  turn.scrollIntoView({ behavior: "smooth", block: "start" });
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;

  input.value = "";
  send.disabled = true;
  const pending = el("div", "turn");
  pending.appendChild(el("div", "q", question));
  pending.appendChild(el("div", "a stamp", "thinking…"));
  log.appendChild(pending);
  pending.scrollIntoView({ behavior: "smooth", block: "start" });

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    pending.remove();
    if (!res.ok) {
      const t = el("div", "turn");
      t.appendChild(el("div", "q", question));
      t.appendChild(el("div", "a bad", data.error || "request failed"));
      log.appendChild(t);
    } else {
      renderTurn(question, data);
      const down = Object.entries(data.unreachable || {});
      banner.replaceChildren();
      if (down.length) {
        const b = el("div", "banner");
        b.textContent = "Degraded — answering without: " +
          down.map(([n, why]) => `${n} (${why})`).join("; ");
        banner.appendChild(b);
      }
    }
  } catch (err) {
    pending.remove();
    const t = el("div", "turn");
    t.appendChild(el("div", "q", question));
    t.appendChild(el("div", "a bad", "Client unreachable: " + err));
    log.appendChild(t);
  } finally {
    send.disabled = false;
    input.focus();
  }
};
</script>
